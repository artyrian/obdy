<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>obdy</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <header>
    <div class="title">obdy <span id="ver" class="muted"></span></div>
    <div class="status"><span id="status">not connected</span> <span id="batt" class="pill">🔋 —</span></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="bar">
    <button id="connect" class="primary">Connect adapter</button>
    <button id="demo">Demo</button>
    <button id="disconnect" hidden>Disconnect</button>
  </section>

  <nav class="tabs">
    <button data-tab="live" class="on">Live</button>
    <button data-tab="diag">DTCs</button>
    <button data-tab="logs">Logs</button>
    <button data-tab="info">Info</button>
  </nav>

  <main>
    <section id="tab-live" class="tab">
      <div class="bar">
        <button id="rec" class="rec" disabled>● Record</button>
        <span id="rate" class="muted"></span>
      </div>
      <div id="tiles" class="tiles"></div>
      <p class="muted small">Recording: ~1 sample/s (more on change), DTCs and misfires every 20 s.
        Saved to the on-device log immediately.</p>
    </section>

    <section id="tab-diag" class="tab" hidden>
      <div class="bar"><button id="read-diag" disabled>Read DTCs and misfires</button></div>
      <div id="diag-out"></div>
    </section>

    <section id="tab-logs" class="tab" hidden>
      <div id="logs"></div>
    </section>

    <section id="tab-info" class="tab" hidden>
      <h3>Browser support</h3>
      <ul id="caps" class="caps"></ul>
      <h3>Log</h3>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
